aid: proteantecs
name: proteanTecs
description: 'proteanTecs is an Israeli deep data analytics company for advanced electronics.
  It embeds on-chip monitoring Agents (UCT, margin, path margin, I/O and power monitors)
  into semiconductor designs and pairs them with cloud and edge machine-learning applications
  that report health, performance, reliability and quality of chips and systems from design
  through production test into field operation. Solutions cover power and performance
  optimization, RAS, functional safety and diagnostics, chip production, system production
  and advanced packaging, and are consumed by semiconductor, data center, AI/HPC, automotive,
  telecom and mobile customers. The company markets APIs and data connectors for integrating
  its analytics with ATE testers and third-party analytics tools, but publishes no public
  developer program, API reference or machine-readable contract.'
